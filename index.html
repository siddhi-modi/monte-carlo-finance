<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Monte Carlo GBM</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; padding: 0 15px; }
    canvas { width: 100%; border: 1px solid #ccc; }
    label { display: block; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Geometric Brownian Motion Simulator</h1>
  <p>Each line is one possible future price of a stock over 1 year.</p>

  <label>Volatility (sigma): <span id="sv">0.20</span>
    <input type="range" id="sigma" min="0.05" max="0.8" step="0.05" value="0.2">
  </label>
  <label>Drift (mu): <span id="mv">0.05</span>
    <input type="range" id="mu" min="-0.1" max="0.3" step="0.01" value="0.05">
  </label>
  <button onclick="run()">Simulate again</button>

  <p id="result"></p>
  <canvas id="c" width="800" height="400"></canvas>

  <script>
    function randn() {
      return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());
    }

    function run() {
      const sigma = parseFloat(document.getElementById("sigma").value);
      const mu = parseFloat(document.getElementById("mu").value);
      document.getElementById("sv").textContent = sigma.toFixed(2);
      document.getElementById("mv").textContent = mu.toFixed(2);

      const S0 = 100, T = 1, steps = 252, paths = 200;
      const dt = T / steps;
      const ctx = document.getElementById("c").getContext("2d");
      ctx.clearRect(0, 0, 800, 400);

      const all = [];
      let maxP = 0, sumEnd = 0;
      for (let i = 0; i < paths; i++) {
        let s = S0;
        const p = [s];
        for (let t = 0; t < steps; t++) {
          s = s * Math.exp((mu - 0.5 * sigma * sigma) * dt + sigma * Math.sqrt(dt) * randn());
          p.push(s);
          if (s > maxP) maxP = s;
        }
        sumEnd += s;
        all.push(p);
      }

      ctx.strokeStyle = "rgba(30,100,220,0.25)";
      all.forEach(p => {
        ctx.beginPath();
        p.forEach((v, t) => {
          const x = (t / steps) * 800;
          const y = 400 - (v / maxP) * 380;
          t === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        });
        ctx.stroke();
      });

      document.getElementById("result").textContent =
        "Mean final price: " + (sumEnd / paths).toFixed(2) +
        " | Expected: " + (S0 * Math.exp(mu * T)).toFixed(2);
    }

    document.getElementById("sigma").oninput = run;
    document.getElementById("mu").oninput = run;
    run();
  </script>
</body>
</html>
